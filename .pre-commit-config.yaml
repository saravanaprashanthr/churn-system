# Install once: make install (runs `pre-commit install --hook-type pre-commit --hook-type pre-push`).
# ruff and mypy run from the project venv, so they use exactly the versions pinned in requirements/dev.txt.
# evidence/ holds real, unedited command output and is never rewritten by hooks.
exclude: ^evidence/
# Hooks run at commit time; only the unit-test hook (stages: [pre-push]) runs on push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^pipeline/pipeline\.yaml$  # generated by the KFP compiler
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: .venv/bin/ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false  # type-check the whole project: a change can break callers in other files
      - id: unit-tests
        name: unit tests (no database)
        entry: .venv/bin/pytest -q -m "not integration and not model" -p no:cacheprovider --no-cov
        language: system
        pass_filenames: false
        stages: [pre-push]
