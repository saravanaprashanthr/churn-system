# Weekly retraining: train on the published datasets, register a candidate, run the promotion gate.
# The gate is the only way to production; a rejection is a normal outcome (exit 0), an error fails the Job.
# Rolling out a promoted model is deploy/deploy.sh (it deploys the version behind alias 'production').
# Applied by deploy/retrain/install.sh, which substitutes ${TRAINER_IMAGE}.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: churn-retrain
  labels:
    app.kubernetes.io/name: churn-retrain
spec:
  schedule: "0 3 * * 1"            # Mondays 03:00, after the weekly cutoff's dataset is published
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0                # a failed training run needs a person, not a blind retry
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: churn-retrain
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retrain
              image: ${TRAINER_IMAGE}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  python -m training.train --optuna-trials "${OPTUNA_TRIALS}" --out-dir /tmp/training
                  set +e
                  python -m training.promote --candidate models:/churn-90d@candidate --out-dir /tmp/promotion
                  code=$?
                  echo "promotion gate exit code: $code (0 promoted, 1 rejected, 2 error)"
                  [ "$code" -le 1 ]
              env:
                - name: OPTUNA_TRIALS
                  value: "20"
                - name: MLFLOW_TRACKING_URI
                  value: http://host.docker.internal:5001
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: churn-retrain
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
