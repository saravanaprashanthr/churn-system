[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-system"
version = "0.1.0"
description = "Time-series churn system: SQL, data quality, pipeline, model, serving, monitoring"
requires-python = ">=3.11,<3.12"
# Exact pins live in requirements/*.txt (compiled with `uv pip compile` from requirements/*.in).
dependencies = ["psycopg[binary]==3.3.8"]

[tool.setuptools.packages.find]
include = ["data_quality*"]

[tool.setuptools.package-data]
data_quality = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a Postgres database; set DQ_TEST_DATABASE_URL",
]

[tool.coverage.run]
source = ["data_quality"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# SIM108 would turn the two-level if/else in gate.evaluate into a nested ternary, which reads worse.
ignore = ["SIM108"]
