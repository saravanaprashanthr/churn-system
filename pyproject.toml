[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-system"
version = "0.1.0"
description = "Time-series churn system: SQL, data quality, pipeline, model, serving, monitoring"
requires-python = ">=3.11,<3.12"
# Exact pins live in requirements/*.txt (compiled with `uv pip compile` from requirements/*.in).
dependencies = [
    "psycopg[binary]==3.3.8",
    "kfp==2.18.0",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pandera==0.35.0",
]

[tool.setuptools.packages.find]
include = ["data_quality*", "pipeline*", "training*", "serving*", "monitoring*"]

[tool.setuptools.package-data]
data_quality = ["*.sql"]
pipeline = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a Postgres database; set DQ_TEST_DATABASE_URL",
    "model: behavior tests of a registered model on the holdout; needs MLflow + DATABASE_URL (MODEL_URI)",
    "container: starts the built API image; needs Docker and CHURN_API_IMAGE",
]

[tool.coverage.run]
source = ["data_quality", "pipeline", "training", "serving", "monitoring"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
# Supplied verbatim by the Candidate Submission Guide; not our code.
extend-exclude = ["build_submission_bundle.py"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "N",
    "T20",  # no print(): library code logs; the few CLI outputs are listed below
    "S",    # flake8-bandit: hard-coded secrets, injection, unsafe subprocess
]
# SIM108 would turn the two-level if/else in gate.evaluate into a nested ternary, which reads worse.
ignore = [
    "SIM108",  # nested ternaries read worse than the if/else in gate.evaluate
    "N803",    # X / X_train: the scikit-learn naming convention for feature matrices
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest asserts
# The rule catalog assembles SQL from table/column names written in this file, never from input;
# values always go through bound parameters (%(as_of)s).
"data_quality/rules.py" = ["S608"]
"scripts/dq_sandbox_demo.py" = ["T201"]  # an interactive console walkthrough: printing is its job
"pipeline/pipeline.py" = ["T201"]  # CLI result on stdout: the compiled file's path
"pipeline/run_local.py" = ["T201"]  # CLI result on stdout: cutoff -> dataset_version table

[tool.mypy]
exclude = ["build_submission_bundle\\.py"]
python_version = "3.11"
files = ["data_quality", "pipeline", "training", "serving", "monitoring", "tests", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["kfp.*", "mlflow.*", "sklearn.*", "optuna.*", "skops.*", "pandera.*", "pyarrow.*", "docker.*", "yaml", "scipy.*"]
ignore_missing_imports = true
