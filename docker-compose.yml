services:
  postgres:
    image: postgres:16
    container_name: ds_interview_postgres
    restart: unless-stopped
    # Docker's default /dev/shm is 64 MB. Parallel VACUUM and parallel query workers allocate
    # dynamic shared memory there and failed with "could not resize shared memory segment ...
    # No space left on device" on the 10M-row events table.
    shm_size: 1g
    environment:
      POSTGRES_USER: ds_candidate
      POSTGRES_PASSWORD: ds_candidate_pw
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_candidate -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: ds_interview_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # MLflow tracking server and model registry (Part D). Backend store: the "mlflow" database in the
  # Postgres above (sql/04_mlflow_database.sql). Artifacts: stored on the mlartifacts volume and served
  # over HTTP by this server, so training, serving pods and CI only need the tracking URL.
  mlflow:
    build:
      context: .
      dockerfile: mlflow_server/Dockerfile
    image: churn-mlflow:3.18.0
    container_name: churn_mlflow
    restart: unless-stopped
    environment:
      # MLflow 3 starts a background job runner (~8 extra Python processes, ~2 GB) for GenAI features
      # this project does not use. Off: the server then needs ~250 MB.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri postgresql+psycopg2://ds_candidate:ds_candidate_pw@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts "localhost:5001,127.0.0.1:5001,host.docker.internal:5001,mlflow:5000"
    ports:
      # Host port 5001: macOS AirPlay Receiver (ControlCenter) already listens on 5000.
      - "5001:5000"
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlartifacts:
